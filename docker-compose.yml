services:
  postgres:
    image: postgres:16-alpine
    container_name: lifelink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lifelink}
      POSTGRES_USER: ${POSTGRES_USER:-lifelink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifelink_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - lifelink-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifelink} -d ${POSTGRES_DB:-lifelink}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lifelink-postgres-data:
